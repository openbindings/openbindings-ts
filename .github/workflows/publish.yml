name: Publish

# Publishes every workspace package to npm when a release tag lands.
# Auth is npm trusted publishing (OIDC): no long-lived token lives in this
# repo. One-time setup before the first run: on npmjs.com, each
# @openbindings/* package lists this repository + this workflow file as its
# trusted publisher. --provenance attaches the npm build-provenance
# attestation to every published tarball.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Same corpus checkouts as ci.yml: the publish gate runs the full test
      # suite in corpus-required mode — nothing unverified ships.
      - uses: actions/checkout@v7
        with:
          repository: openbindings/spec
          path: spec
      - uses: actions/checkout@v7
        with:
          repository: openbindings/interfaces
          path: interfaces
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # Node 24 ships npm 11+, required for the OIDC token exchange.
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Verify annotated tag and package versions
        run: |
          test "$(git cat-file -t "${{ github.ref_name }}")" = tag
          pnpm release:verify -- --tag "${{ github.ref_name }}"
      - run: pnpm test:release
      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm test
        env:
          OB_SPEC_CORPUS: ${{ github.workspace }}/spec/conformance
          OB_INTERFACES_CORPUS: ${{ github.workspace }}/interfaces/conformance
          OB_CORPUS_REQUIRED: "1"
      - run: pnpm conformance -- --corpus=spec/conformance
      - run: pnpm pack:verify
      # --no-git-checks: the tag checkout is a detached HEAD, which pnpm
      # publish otherwise refuses. Each package's prepack rebuilds its dist.
      - run: pnpm -r publish --access public --provenance --no-git-checks
