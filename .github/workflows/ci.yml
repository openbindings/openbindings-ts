name: CI

on:
  push:
    branches: [main, release/0.2]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: openbindings-ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: openbindings-ts
      # The conformance corpora are normative and live in the sibling spec and
      # interfaces repos; without these checkouts the corpus gates skip
      # silently. These fixed inputs qualify this legacy consumer; dependency
      # updates must run its own behavioral checks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: openbindings/spec
          ref: 2f7d754dc2da374058cd517064c17e50f7d95d99
          path: spec
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: openbindings/interfaces
          ref: c3d85bd8a534d344b0309f2b9ab27deed92399d6
          path: interfaces
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: openbindings/openapi-client
          ref: 0ed7cfca730aa66dcbf04239bca4fc4992f6b119
          path: openapi-client
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: openbindings/asyncapi-client
          ref: 7326ce4e18c12e1dcb36c3587fbe0f7fe52ec749
          path: asyncapi-client
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: openbindings-ts/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: openbindings-ts/pnpm-lock.yaml
      - name: Build neutral JSON prerequisites
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @openbindings/json --filter @openbindings/json-schema build
      - name: Build standalone artifact clients
        run: |
          pnpm --dir ../openapi-client install --frozen-lockfile
          pnpm --dir ../openapi-client build
          pnpm --dir ../asyncapi-client install --frozen-lockfile
          pnpm --dir ../asyncapi-client build
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run pack:verify
      - run: pnpm run lint
      - run: pnpm test:release
      # Absolute: `pnpm -r` runs each package from its own directory, so a
      # relative corpus path would resolve to nothing and silently skip the
      # corpus-backed suites instead of running them. OB_CORPUS_REQUIRED flips
      # every corpus locator from skip-if-absent to fail-if-absent, so a
      # mis-wired path or missing checkout turns CI red instead of silently
      # green; local dev (flag unset) still skips.
      - run: pnpm test
        env:
          OB_SPEC_CORPUS: ${{ github.workspace }}/spec/conformance
          OB_INTERFACES_CORPUS: ${{ github.workspace }}/interfaces/conformance
          OB_CORPUS_REQUIRED: "1"
      - run: pnpm conformance -- --corpus=${{ github.workspace }}/spec/conformance
