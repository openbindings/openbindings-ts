name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openbindings-ts
    steps:
      - uses: actions/checkout@v7
        with:
          path: openbindings-ts
      # The conformance corpora are normative and live in the sibling spec and
      # interfaces repos; without these checkouts the corpus gates skip
      # silently. Interfaces was never checked out here, so the selection and
      # comparison corpora ran in no CI at all. This pre-release integration
      # branch tracks the matching non-default spec working branch.
      - uses: actions/checkout@v7
        with:
          repository: openbindings/spec
          ref: release/0.2
          path: spec
      - uses: actions/checkout@v7
        with:
          repository: openbindings/interfaces
          path: interfaces
      - uses: actions/checkout@v7
        with:
          repository: openbindings/openbindings-go
          ref: release/0.2
          path: openbindings-go
      - uses: actions/checkout@v7
        with:
          repository: openbindings/openapi-client
          ref: main
          path: openapi-client
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: openbindings-ts/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: openbindings-ts/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run pack:verify
      - run: pnpm correspondence
        env:
          OB_SPEC_CORPUS: ${{ github.workspace }}/spec/conformance
          OB_GO_ROOT: ${{ github.workspace }}/openbindings-go
      - run: pnpm run lint
      - run: pnpm test:release
      # Absolute: `pnpm -r` runs each package from its own directory, so a
      # relative corpus path would resolve to nothing and silently skip the
      # corpus-backed suites instead of running them. OB_CORPUS_REQUIRED flips
      # every corpus locator from skip-if-absent to fail-if-absent, so a
      # mis-wired path or missing checkout turns CI red instead of silently
      # green; local dev (flag unset) still skips.
      - run: pnpm test
        env:
          OB_SPEC_CORPUS: ${{ github.workspace }}/spec/conformance
          OB_INTERFACES_CORPUS: ${{ github.workspace }}/interfaces/conformance
          OB_CORPUS_REQUIRED: "1"
      - run: pnpm conformance -- --corpus=${{ github.workspace }}/spec/conformance
