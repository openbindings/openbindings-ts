name: CI

on:
  push:
    branches: [main, "experiment/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: openbindings/spec
          path: spec
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run lint
      # Absolute: `pnpm -r` runs each package from its own directory, so a
      # relative corpus path would resolve to nothing and silently skip the
      # corpus-backed suites instead of running them.
      - run: pnpm test
        env:
          OB_SPEC_CORPUS: ${{ github.workspace }}/spec/conformance
      - run: pnpm conformance -- --corpus=spec/conformance
